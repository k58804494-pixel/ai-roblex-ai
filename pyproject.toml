[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kamil-ai-gamer"
version = "0.1.0"
description = "A general game-playing AI framework: vision -> reasoning -> control -> memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kamil" }]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
vision = ["mss>=9.0", "pillow>=10.0", "pytesseract>=0.3.10", "opencv-python>=4.8"]
control = ["pynput>=1.7"]
llm = ["openai>=1.30"]
config = ["pyyaml>=6.0"]
all = [
    "mss>=9.0", "pillow>=10.0", "pytesseract>=0.3.10", "opencv-python>=4.8",
    "pynput>=1.7", "openai>=1.30", "pyyaml>=6.0",
]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
kamil-gamer = "kamil_gamer.__main__:main"

[tool.setuptools.packages.find]
include = ["kamil_gamer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
